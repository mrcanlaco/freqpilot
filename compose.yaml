name: ${FREQPILOT_PROJECT_NAME:-codex-freqtrade}
x-common: &common
  volumes:
    - ${FREQPILOT_USER_DATA:?Set FREQPILOT_USER_DATA in .env}:/freqtrade/user_data
    - ./ui/dist:/freqtrade/freqtrade/rpc/api_server/ui/installed:ro
  restart: unless-stopped
services:
  paper:
    <<: *common
    image: freqtradeorg/freqtrade@sha256:9d67afb8eb5f4e1210f4fb067efcbd5e005bd4f1c27f6f3888b8b9fc7f9b5199
    ports:
      - "127.0.0.1:8090:8080"
    command: >-
      trade --config user_data/config.json --strategy StarterFutures --dry-run
      --db-url sqlite:////freqtrade/user_data/tradesv3.paper.sqlite
      --logfile user_data/logs/paper.log
  backtest:
    <<: *common
    image: ${FREQPILOT_IMAGE:-codex-freqpilot:2026.9-v0.1}
    build: ./backend
    ports:
      - "127.0.0.1:8091:8080"
    command: webserver --config user_data/config.json
  research-paper:
    <<: *common
    image: ${FREQPILOT_IMAGE:-codex-freqpilot:2026.9-v0.1}
    ports:
      - "127.0.0.1:8095:8080"
    entrypoint: /bin/sh
    command:
      - -c
      - python -m freqtrade.rpc.api_server.api_paper && exec freqtrade trade --config /freqtrade/user_data/freqpilot/paper/active/config.json --dry-run
